<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" width="720" height="405" role="img" aria-labelledby="t d"><title id="t">AI judges go easy on their own mistakes</title><desc id="d">Two bars. An AI judge checking another AI's answers passes some failed answers. Checking its own answers, it passes up to 50 percent more of them.</desc><style>svg{--bg:#14120f;--surf:#221e19;--ink:#f3ede4;--muted:#b5ab9e;--line:#3a332b;--brand:#d67a84;--onbrand:#14120f;--blue:#4e88d3;--green:#479650;--purple:#9177cf;--danger:#db6141;--tint:#3a2326}text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}@keyframes lb{0.00%{opacity:0}40.00%{opacity:0}46.25%{opacity:1}92.50%{opacity:1}100.00%{opacity:0}}@keyframes g1{0.00%{transform:scaleX(0)}5.00%{transform:scaleX(0)}20.00%{transform:scaleX(1)}92.50%{transform:scaleX(1)}100.00%{transform:scaleX(0)}}@keyframes g2{0.00%{transform:scaleX(0)}20.00%{transform:scaleX(0)}35.00%{transform:scaleX(1)}92.50%{transform:scaleX(1)}100.00%{transform:scaleX(0)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="720" height="405" rx="18" fill="var(--bg)"/><text x="40" y="56" font-size="26" font-weight="800" fill="var(--ink)">How often an AI judge passes a failed answer</text>
<text x="40" y="86" font-size="16" fill="var(--muted)">Same mistakes, judged by the AI that made them or by another AI</text>
<text x="40" y="150" font-size="17" font-weight="700" fill="var(--ink)">Another AI's answer</text>
<rect x="40" y="164" width="640" height="42" rx="10" fill="var(--surf)" stroke="var(--line)"/>
<rect style="transform-origin:40px 0;animation:g1 8s linear infinite" x="40" y="164" width="300" height="42" rx="10" fill="var(--muted)"/>
<text x="40" y="256" font-size="17" font-weight="700" fill="var(--ink)">Its own answer</text>
<rect x="40" y="270" width="640" height="42" rx="10" fill="var(--surf)" stroke="var(--line)"/>
<rect style="transform-origin:40px 0;animation:g2 8s linear infinite" x="40" y="270" width="456" height="42" rx="10" fill="var(--brand)"/>
<g style="animation:lb 8s linear infinite"><text x="680" y="256" text-anchor="end" font-size="18" font-weight="800" fill="var(--brand)">up to 50%+ more</text></g>
<text x="40" y="364" font-size="14" fill="var(--muted)">Illustration. Source: Pombal, Rei and Martins, 2026 (preprint).</text></svg>
