<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" width="720" height="405" role="img" aria-labelledby="t d"><title id="t">The 75 percent ATS myth</title><desc id="d">A quote, "75% of resumes are rejected by ATS before a human sees them", is stamped NO SOURCE. The figure traces back to a vendor that closed in 2013. Most resumes are turned down by people, not software.</desc><style>svg{--bg:#f7f4ef;--surf:#fffdf9;--ink:#221e19;--muted:#5f574d;--line:#ddd5c8;--brand:#a8515c;--onbrand:#ffffff;--blue:#35619a;--green:#2f6c36;--purple:#685497;--danger:#a14126;--tint:#f3e6e6}@media (prefers-color-scheme:dark){svg{--bg:#14120f;--surf:#221e19;--ink:#f3ede4;--muted:#b5ab9e;--line:#3a332b;--brand:#d67a84;--onbrand:#14120f;--blue:#4e88d3;--green:#479650;--purple:#9177cf;--danger:#db6141;--tint:#3a2326}}text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}@keyframes st{0.00%{opacity:0}22.50%{opacity:0;transform:rotate(-8deg) scale(1.6)}27.50%{opacity:1;transform:rotate(-8deg) scale(1)}92.50%{opacity:1;transform:rotate(-8deg) scale(1)}100.00%{opacity:0}}@keyframes f{0.00%{opacity:0}37.50%{opacity:0}43.75%{opacity:1}92.50%{opacity:1}100.00%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="720" height="405" rx="18" fill="var(--bg)"/><text x="40" y="60" font-size="15" font-weight="700" letter-spacing="1.5" fill="var(--muted)">YOU'VE PROBABLY READ THIS</text>
<text x="40" y="128" font-size="34" font-weight="800" fill="var(--ink)">"75% of resumes are rejected</text>
<text x="40" y="172" font-size="34" font-weight="800" fill="var(--ink)">by ATS before a human</text>
<text x="40" y="216" font-size="34" font-weight="800" fill="var(--ink)">sees them"</text>
<g style="transform-origin:550px 200px;animation:st 8s linear infinite"><rect x="440" y="168" width="220" height="64" rx="10" fill="var(--bg)" stroke="var(--danger)" stroke-width="5"/>
<text x="550" y="211" text-anchor="middle" font-size="28" font-weight="900" letter-spacing="2" fill="var(--danger)">NO SOURCE</text></g>
<g style="animation:f 8s linear infinite"><text x="40" y="286" font-size="20" fill="var(--ink)">The figure traces back to a vendor that closed in 2013.</text>
<text x="40" y="316" font-size="20" fill="var(--ink)">Most resumes are turned down by people, not software.</text></g>
<text x="40" y="364" font-size="14" fill="var(--muted)">Sources: HRTact (2020); Greenhouse Talent Matching FAQ.</text></svg>
