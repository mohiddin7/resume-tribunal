<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" width="720" height="405" role="img" aria-labelledby="t d"><title id="t">An AI grading its own homework</title><desc id="d">An AI marks its own resume draft A+ and writes Flawless. Then a second AI from a different company circles 'Spearheaded' and '4 hours' and writes: Spearheaded? Really? You said half a day. See me after class.</desc><style>svg{--bg:#f7f4ef;--surf:#fffdf9;--ink:#221e19;--muted:#5f574d;--line:#ddd5c8;--brand:#a8515c;--onbrand:#ffffff;--blue:#35619a;--green:#2f6c36;--purple:#685497;--danger:#a14126;--tint:#f3e6e6}text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}@keyframes gr{0.00%{opacity:0;transform:scale(2) rotate(-20deg)}10.00%{opacity:0;transform:scale(2) rotate(-20deg)}14.00%{opacity:1;transform:scale(1) rotate(-12deg)}94.00%{opacity:1;transform:scale(1) rotate(-12deg)}100.00%{opacity:0}}@keyframes pr{0.00%{opacity:0}18.00%{opacity:0}22.00%{opacity:1}94.00%{opacity:1}100.00%{opacity:0}}@keyframes c1{0.00%{stroke-dashoffset:400}42.00%{stroke-dashoffset:400}49.00%{stroke-dashoffset:0}94.00%{stroke-dashoffset:0}100.00%{stroke-dashoffset:400}}@keyframes c2{0.00%{stroke-dashoffset:400}52.00%{stroke-dashoffset:400}59.00%{stroke-dashoffset:0}94.00%{stroke-dashoffset:0}100.00%{stroke-dashoffset:400}}@keyframes nt{0.00%{opacity:0;transform:translateY(8px)}63.00%{opacity:0;transform:translateY(8px)}68.00%{opacity:1;transform:translateY(0)}94.00%{opacity:1}100.00%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="720" height="405" rx="18" fill="var(--bg)"/><text x="40" y="44" font-size="15" font-weight="700" letter-spacing="1.5" fill="var(--muted)">AI 1 MARKS ITS OWN RESUME DRAFT</text>
<rect x="40" y="64" width="400" height="300" rx="14" fill="var(--surf)" stroke="var(--line)" stroke-width="1.5"/>
<rect x="64" y="90" width="170" height="12" rx="6" fill="var(--ink)" opacity=".8"/>
<text x="64" y="146" font-size="17" fill="var(--ink)">Spearheaded synergy across teams</text>
<text x="64" y="196" font-size="17" fill="var(--ink)">Cut report prep from 4 hours to 40 min</text>
<text x="64" y="246" font-size="17" fill="var(--ink)">Leveraged data to drive results</text>
<rect x="64" y="284" width="250" height="9" rx="4.5" fill="var(--muted)" opacity=".3"/><rect x="64" y="306" width="190" height="9" rx="4.5" fill="var(--muted)" opacity=".3"/>
<g style="transform-origin:250px 120px;animation:gr 10s linear infinite"><circle cx="380" cy="118" r="42" fill="none" stroke="var(--blue)" stroke-width="4"/><text x="380" y="132" text-anchor="middle" font-size="40" font-weight="900" fill="var(--blue)">A+</text></g>
<g style="animation:pr 10s linear infinite"><text x="330" y="312" font-size="20" font-weight="800" fill="var(--blue)" transform="rotate(-6 330 312)">Flawless!</text></g>
<rect style="animation:c1 10s linear infinite" x="56" y="124" width="116" height="30" rx="15" fill="none" stroke="var(--danger)" stroke-width="3" stroke-dasharray="400"/>
<rect style="animation:c2 10s linear infinite" x="232" y="174" width="80" height="30" rx="15" fill="none" stroke="var(--danger)" stroke-width="3" stroke-dasharray="400"/>
<g style="animation:nt 10s linear infinite"><rect x="458" y="140" width="232" height="128" rx="14" fill="var(--surf)" stroke="var(--danger)" stroke-width="2"/>
<text x="476" y="172" font-size="12" font-weight="800" letter-spacing=".6" fill="var(--danger)">AI 2, A DIFFERENT COMPANY</text>
<text x="476" y="204" font-size="17" fill="var(--ink)">"Spearheaded"? Really?</text>
<text x="476" y="232" font-size="17" fill="var(--ink)">You said half a day.</text>
<text x="476" y="258" font-size="17" font-weight="800" fill="var(--danger)">See me after class.</text></g>
<text x="40" y="392" font-size="14" fill="var(--muted)">Same draft. The AI that wrote it loved it. The one that didn't, didn't.</text></svg>
