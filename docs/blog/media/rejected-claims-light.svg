<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" width="720" height="405" role="img" aria-labelledby="t d"><title id="t">A made-up number, rejected</title><desc id="d">A reviewing AI suggested "cut report prep from 4 hours to 40 minutes". It is crossed out and marked rejected, because the candidate had said "half a day". The kept line reads "cut report prep from half a day to about 40 minutes".</desc><style>svg{--bg:#f7f4ef;--surf:#fffdf9;--ink:#221e19;--muted:#5f574d;--line:#ddd5c8;--brand:#a8515c;--onbrand:#ffffff;--blue:#35619a;--green:#2f6c36;--purple:#685497;--danger:#a14126;--tint:#f3e6e6}text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}@keyframes s{0.00%{stroke-dashoffset:470}17.78%{stroke-dashoffset:470}26.67%{stroke-dashoffset:0}93.33%{stroke-dashoffset:0}100.00%{stroke-dashoffset:470}}@keyframes p{0.00%{opacity:0}27.78%{opacity:0;transform:scale(1.3)}31.11%{opacity:1;transform:scale(1)}93.33%{opacity:1}100.00%{opacity:0}}@keyframes w{0.00%{opacity:0}37.78%{opacity:0}43.33%{opacity:1}93.33%{opacity:1}100.00%{opacity:0}}@keyframes k{0.00%{opacity:0}53.33%{opacity:0;transform:translateY(8px)}60.00%{opacity:1;transform:translateY(0)}93.33%{opacity:1}100.00%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="720" height="405" rx="18" fill="var(--bg)"/><text x="40" y="52" font-size="15" font-weight="700" letter-spacing="1.5" fill="var(--muted)">A REVIEWING AI SUGGESTED</text>
<rect x="40" y="72" width="640" height="84" rx="14" fill="var(--surf)" stroke="var(--line)" stroke-width="1.5"/>
<text x="64" y="122" font-size="20" fill="var(--ink)">Cut report prep from 4 hours to 40 minutes</text>
<path style="animation:s 9s linear infinite" d="M60 115 h420" stroke="var(--danger)" stroke-width="3.5" stroke-dasharray="470" stroke-linecap="round"/>
<g style="transform-origin:602px 114px;animation:p 9s linear infinite"><rect x="546" y="96" width="112" height="36" rx="18" fill="var(--danger)"/>
<text x="602" y="120" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">Rejected</text></g>
<g style="animation:w 9s linear infinite"><text x="40" y="206" font-size="19" fill="var(--muted)">The candidate actually said: <tspan font-weight="700" fill="var(--ink)">"half a day"</tspan></text></g>
<g style="animation:k 9s linear infinite"><rect x="40" y="236" width="640" height="84" rx="14" fill="var(--surf)" stroke="var(--green)" stroke-width="2.5"/>
<text x="64" y="285" font-size="20" fill="var(--ink)">Cut report prep from half a day to about 40 minutes</text>
<circle cx="646" cy="278" r="16" fill="var(--green)"/><path d="M638 278l6 6 10-11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="40" y="368" font-size="15" fill="var(--muted)">Resume Tribunal: the candidate's own words decide. From the worked example.</text></svg>
