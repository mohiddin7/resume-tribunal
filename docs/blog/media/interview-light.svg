<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" width="720" height="405" role="img" aria-labelledby="t d"><title id="t">The interview question, twice</title><desc id="d">An interviewer asks how you saved those 4 hours. With a made-up number the answer is: Uh. Well. It was more of a vibe. With your own words, checked: Half a day to 40 minutes. Here's how.</desc><style>svg{--bg:#f7f4ef;--surf:#fffdf9;--ink:#221e19;--muted:#5f574d;--line:#ddd5c8;--brand:#a8515c;--onbrand:#ffffff;--blue:#35619a;--green:#2f6c36;--purple:#685497;--danger:#a14126;--tint:#f3e6e6}text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}@keyframes q1{0.00%{opacity:0;transform:translateY(8px)}2.50%{opacity:0;transform:translateY(8px)}5.83%{opacity:1;transform:translateY(0)}45.00%{opacity:1;transform:translateY(0)}48.33%{opacity:0}100.00%{opacity:0}}@keyframes a1{0.00%{opacity:0;transform:translateY(8px)}11.67%{opacity:0;transform:translateY(8px)}15.00%{opacity:1;transform:translateY(0)}45.00%{opacity:1;transform:translateY(0)}48.33%{opacity:0}100.00%{opacity:0}}@keyframes q2{0.00%{opacity:0;transform:translateY(8px)}51.67%{opacity:0;transform:translateY(8px)}55.00%{opacity:1;transform:translateY(0)}95.00%{opacity:1;transform:translateY(0)}98.33%{opacity:0}100.00%{opacity:0}}@keyframes a2{0.00%{opacity:0;transform:translateY(8px)}60.83%{opacity:0;transform:translateY(8px)}64.17%{opacity:1;transform:translateY(0)}95.00%{opacity:1;transform:translateY(0)}98.33%{opacity:0}100.00%{opacity:0}}@keyframes dr{0.00%{opacity:0}18.33%{opacity:0}20.83%{opacity:1;transform:translateY(0)}38.33%{opacity:1;transform:translateY(6px)}45.00%{opacity:0}100.00%{opacity:0}}@keyframes t1{0.00%{opacity:0;transform:translateY(8px)}25.00%{opacity:0;transform:translateY(8px)}28.33%{opacity:1;transform:translateY(0)}45.00%{opacity:1;transform:translateY(0)}48.33%{opacity:0}100.00%{opacity:0}}@keyframes t2{0.00%{opacity:0;transform:translateY(8px)}71.67%{opacity:0;transform:translateY(8px)}75.00%{opacity:1;transform:translateY(0)}95.00%{opacity:1;transform:translateY(0)}98.33%{opacity:0}100.00%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="720" height="405" rx="18" fill="var(--bg)"/><text x="40" y="44" font-size="15" font-weight="700" letter-spacing="1.5" fill="var(--muted)">THE INTERVIEW, TWICE</text>
<g style="animation:q1 12s linear infinite"><rect x="40" y="70" width="460" height="62" rx="18" fill="var(--surf)" stroke="var(--line)" stroke-width="1.5"/>
<text x="62" y="108" font-size="18" fill="var(--ink)">"So, how did you save those 4 hours?"</text></g>
<g style="animation:a1 12s linear infinite"><circle cx="620" cy="210" r="26" fill="var(--surf)" stroke="var(--ink)" stroke-width="2.5"/><circle cx="611" cy="205" r="2.6" fill="var(--ink)"/><circle cx="629" cy="205" r="2.6" fill="var(--ink)"/><path d="M609 222q11-6 22 0" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>
<rect x="240" y="180" width="330" height="58" rx="18" fill="var(--tint)"/><text x="262" y="216" font-size="18" fill="var(--ink)">"Uh. Well. It was more of a... vibe."</text></g>
<g style="animation:dr 12s linear infinite"><path d="M650 180q4 8 0 12q-4-4 0-12zM592 186q4 8 0 12q-4-4 0-12z" fill="var(--blue)"/></g>
<g style="animation:t1 12s linear infinite"><rect x="240" y="270" width="196" height="34" rx="17" fill="var(--danger)"/><text x="338" y="292" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">Made-up number</text></g>
<g style="animation:q2 12s linear infinite"><rect x="40" y="70" width="460" height="62" rx="18" fill="var(--surf)" stroke="var(--line)" stroke-width="1.5"/>
<text x="62" y="108" font-size="18" fill="var(--ink)">"So, how did you cut that report time?"</text></g>
<g style="animation:a2 12s linear infinite"><circle cx="620" cy="210" r="26" fill="var(--surf)" stroke="var(--ink)" stroke-width="2.5"/><circle cx="611" cy="205" r="2.6" fill="var(--ink)"/><circle cx="629" cy="205" r="2.6" fill="var(--ink)"/><path d="M607 216q13 12 26 0" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>
<rect x="190" y="180" width="380" height="58" rx="18" fill="var(--tint)"/><text x="210" y="216" font-size="18" fill="var(--ink)">"Half a day to 40 minutes. Here's how."</text></g>
<g style="animation:t2 12s linear infinite"><rect x="190" y="270" width="226" height="34" rx="17" fill="var(--green)"/><text x="303" y="292" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">Your own words, checked</text></g>
<text x="40" y="380" font-size="14" fill="var(--muted)">Every line on your resume has to survive this question.</text></svg>
