<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" width="720" height="405" role="img" aria-labelledby="t d"><title id="t">A blind check by a different AI</title><desc id="d">A draft written by AI 1 moves to AI 2, from a different company. On the way its label changes from written by AI 1 to Draft K, so the checker is not told who wrote it. No AI grades its own work.</desc><style>svg{--bg:#f7f4ef;--surf:#fffdf9;--ink:#221e19;--muted:#5f574d;--line:#ddd5c8;--brand:#a8515c;--onbrand:#ffffff;--blue:#35619a;--green:#2f6c36;--purple:#685497;--danger:#a14126;--tint:#f3e6e6}text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}@keyframes mv{0.00%{transform:translateX(0)}13.33%{transform:translateX(0)}28.89%{transform:translateX(342px)}93.33%{transform:translateX(342px)}100.00%{transform:translateX(0)}}@keyframes tg{0.00%{opacity:1}12.22%{opacity:1}16.67%{opacity:0}95.56%{opacity:0}100.00%{opacity:1}}@keyframes an{0.00%{opacity:0}28.89%{opacity:0}33.33%{opacity:1}93.33%{opacity:1}100.00%{opacity:0}}@keyframes q{0.00%{opacity:0}37.78%{opacity:0}43.33%{opacity:1}93.33%{opacity:1}100.00%{opacity:0}}@keyframes ok{0.00%{opacity:0}55.56%{opacity:0}61.11%{opacity:1}93.33%{opacity:1}100.00%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="720" height="405" rx="18" fill="var(--bg)"/><rect x="40" y="70" width="250" height="250" rx="18" fill="var(--surf)" stroke="var(--blue)" stroke-width="2"/>
<text x="64" y="106" font-size="15" font-weight="700" letter-spacing="1.5" fill="var(--blue)">AI 1 · WRITES</text>
<rect x="430" y="70" width="250" height="250" rx="18" fill="var(--surf)" stroke="var(--brand)" stroke-width="2"/>
<text x="454" y="106" font-size="15" font-weight="700" letter-spacing="1.5" fill="var(--brand)">AI 2 · CHECKS</text>
<text x="165" y="300" text-anchor="middle" font-size="14" fill="var(--muted)">writes the draft</text>
<text x="454" y="128" font-size="14" fill="var(--muted)">from a different company</text>
<g style="animation:mv 9s linear infinite"><rect x="96" y="150" width="128" height="150" rx="10" fill="var(--bg)" stroke="var(--line)"/>
<path d="M114 182h92M114 204h92M114 226h70M114 248h84" stroke="var(--muted)" stroke-width="5" stroke-linecap="round"/>
<g style="animation:tg 9s linear infinite"><rect x="104" y="270" width="112" height="22" rx="11" fill="var(--blue)"/><text x="160" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="var(--onbrand)">written by AI 1</text></g>
<g style="animation:an 9s linear infinite"><rect x="116" y="270" width="88" height="22" rx="11" fill="var(--muted)"/><text x="160" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="var(--bg)">Draft K</text></g></g>
<g style="animation:q 9s linear infinite"><text x="555" y="352" text-anchor="middle" font-size="17" fill="var(--ink)">Who wrote this? <tspan font-weight="800">It isn't told.</tspan></text></g>
<g style="animation:ok 9s linear infinite"><rect x="40" y="338" width="250" height="34" rx="17" fill="var(--tint)"/><text x="165" y="361" text-anchor="middle" font-size="15" font-weight="700" fill="var(--brand)">No AI grades its own work</text></g>
<text x="40" y="44" font-size="22" font-weight="800" fill="var(--ink)">The check that makes the difference</text></svg>
