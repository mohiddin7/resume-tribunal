<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 918" width="680" height="918" role="img" aria-labelledby="t d"><title id="t">How Resume Tribunal works</title><desc id="d">You give your resume, the job posting and a few sentences in your own words. Your assistant writes a draft from your facts only. An AI from a different company checks it without being told who wrote it; in full council three AIs draft and critique each other under shuffled labels. A script flags AI writing habits, layout problems and numbers you never gave. You approve every changed line. You get a resume you can defend.</desc><style>svg{--bg:#f7f4ef;--surf:#fffdf9;--ink:#221e19;--muted:#5f574d;--line:#ddd5c8;--brand:#a8515c;--onbrand:#ffffff;--blue:#35619a;--green:#2f6c36;--purple:#685497}@media (prefers-color-scheme:dark){svg{--bg:#14120f;--surf:#221e19;--ink:#f3ede4;--muted:#b5ab9e;--line:#3a332b;--brand:#d67a84;--onbrand:#14120f;--blue:#4e88d3;--green:#479650;--purple:#9177cf}}text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.h{font-size:22px;font-weight:700;fill:var(--ink)}.sub{font-size:13px;fill:var(--muted)}.tag{font-size:12px;font-weight:700;letter-spacing:.08em}.title{font-size:19px;font-weight:700;fill:var(--ink)}.body{font-size:15px;fill:var(--muted)}.card{fill:var(--surf);stroke:var(--line);stroke-width:1.5}.chip{fill:var(--bg);stroke:var(--line)}.chipt{font-size:12px;font-weight:700;fill:var(--ink)}.lit,.dot{opacity:0}@keyframes lit0{0%,0.00%{opacity:0}1.92%,94.62%{opacity:1}98.46%,100%{opacity:0}}@keyframes go0{0%,6.54%{opacity:0;transform:translateY(0)}7.31%{opacity:1;transform:translateY(0)}12.42%{opacity:1;transform:translateY(22px)}13.19%,100%{opacity:0;transform:translateY(22px)}}@keyframes lit1{0%,13.08%{opacity:0}15.00%,94.62%{opacity:1}98.46%,100%{opacity:0}}@keyframes go1{0%,19.62%{opacity:0;transform:translateY(0)}20.38%{opacity:1;transform:translateY(0)}25.50%{opacity:1;transform:translateY(22px)}26.27%,100%{opacity:0;transform:translateY(22px)}}@keyframes lit2{0%,26.15%{opacity:0}28.08%,94.62%{opacity:1}98.46%,100%{opacity:0}}@keyframes go2{0%,32.69%{opacity:0;transform:translateY(0)}33.46%{opacity:1;transform:translateY(0)}38.58%{opacity:1;transform:translateY(22px)}39.35%,100%{opacity:0;transform:translateY(22px)}}@keyframes lit3{0%,39.23%{opacity:0}41.15%,94.62%{opacity:1}98.46%,100%{opacity:0}}@keyframes go3{0%,45.77%{opacity:0;transform:translateY(0)}46.54%{opacity:1;transform:translateY(0)}51.65%{opacity:1;transform:translateY(22px)}52.42%,100%{opacity:0;transform:translateY(22px)}}@keyframes lit4{0%,52.31%{opacity:0}54.23%,94.62%{opacity:1}98.46%,100%{opacity:0}}@keyframes go4{0%,58.85%{opacity:0;transform:translateY(0)}59.62%{opacity:1;transform:translateY(0)}64.73%{opacity:1;transform:translateY(22px)}65.50%,100%{opacity:0;transform:translateY(22px)}}@keyframes lit5{0%,65.38%{opacity:0}67.31%,94.62%{opacity:1}98.46%,100%{opacity:0}}@keyframes go5{0%,71.92%{opacity:0;transform:translateY(0)}72.69%{opacity:1;transform:translateY(0)}77.81%{opacity:1;transform:translateY(22px)}78.58%,100%{opacity:0;transform:translateY(22px)}}@keyframes swapK{0%,28.85%{transform:translateX(0)}35.00%,94.62%{transform:translateX(368px)}99.23%,100%{transform:translateX(0)}}@keyframes swapR{0%,28.85%{transform:translateX(0)}35.00%,94.62%{transform:translateX(-368px)}99.23%,100%{transform:translateX(0)}}@media (prefers-reduced-motion:reduce){.lit,.dot,.mv{animation:none!important}.lit{opacity:1}}</style><rect width="680" height="918" rx="16" fill="var(--bg)"/><text x="40" y="44" class="h">How Resume Tribunal works</text><text x="40" y="64" class="sub">Each step lights up in turn. A quick review takes about 5 minutes, a full council about 15.</text><rect class="card" x="40" y="78" width="600" height="92" rx="12"/><rect class="lit" style="animation:lit0 13.0s ease-in-out infinite" x="40" y="78" width="600" height="92" rx="12" fill="var(--green)" fill-opacity=".07" stroke="var(--green)" stroke-width="2.5"/><rect x="40" y="92" width="5" height="64" rx="2.5" fill="var(--green)"/><text x="64" y="105" class="tag" fill="var(--green)">YOU</text><text x="64" y="130" class="title">You give three things</text><text x="64" y="154" class="body">Your resume, the job posting, and a few sentences in your own words.</text><path d="M340 176 V196" stroke="var(--line)" stroke-width="2" stroke-linecap="round"/><path d="M334 190 l6 7 l6 -7" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle class="dot" style="animation:go0 13.0s ease-in-out infinite" cx="340" cy="176" r="5" fill="var(--blue)"/><rect class="card" x="40" y="204" width="600" height="92" rx="12"/><rect class="lit" style="animation:lit1 13.0s ease-in-out infinite" x="40" y="204" width="600" height="92" rx="12" fill="var(--blue)" fill-opacity=".07" stroke="var(--blue)" stroke-width="2.5"/><rect x="40" y="218" width="5" height="64" rx="2.5" fill="var(--blue)"/><text x="64" y="231" class="tag" fill="var(--blue)">AI 1 · YOUR ASSISTANT</text><text x="64" y="256" class="title">It writes a draft for the job</text><text x="64" y="280" class="body">Only your facts. A missing number becomes a question, never a guess.</text><path d="M340 302 V322" stroke="var(--line)" stroke-width="2" stroke-linecap="round"/><path d="M334 316 l6 7 l6 -7" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle class="dot" style="animation:go1 13.0s ease-in-out infinite" cx="340" cy="302" r="5" fill="var(--brand)"/><rect class="card" x="40" y="330" width="600" height="154" rx="12"/><rect class="lit" style="animation:lit2 13.0s ease-in-out infinite" x="40" y="330" width="600" height="154" rx="12" fill="var(--brand)" fill-opacity=".07" stroke="var(--brand)" stroke-width="2.5"/><rect x="40" y="344" width="5" height="126" rx="2.5" fill="var(--brand)"/><text x="64" y="357" class="tag" fill="var(--brand)">AI 2 · FROM A DIFFERENT COMPANY</text><text x="64" y="382" class="title">A second AI checks it blind</text><text x="64" y="406" class="body">It is not told who wrote the draft, so no AI grades its own work.</text><g class="mv" style="animation:swapK 13.0s ease-in-out infinite"><rect class="chip" x="64" y="428" width="168" height="26" rx="13"/><text x="148" y="445" text-anchor="middle" class="chipt">Draft K</text></g><g><rect class="chip" x="248" y="428" width="168" height="26" rx="13"/><text x="332" y="445" text-anchor="middle" class="chipt">Draft M</text></g><g class="mv" style="animation:swapR 13.0s ease-in-out infinite"><rect class="chip" x="432" y="428" width="168" height="26" rx="13"/><text x="516" y="445" text-anchor="middle" class="chipt">Draft R</text></g><text x="64" y="472" class="sub">Full council: three AIs draft, then critique each other under shuffled labels.</text><path d="M340 490 V510" stroke="var(--line)" stroke-width="2" stroke-linecap="round"/><path d="M334 504 l6 7 l6 -7" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle class="dot" style="animation:go2 13.0s ease-in-out infinite" cx="340" cy="490" r="5" fill="var(--purple)"/><rect class="card" x="40" y="518" width="600" height="92" rx="12"/><rect class="lit" style="animation:lit3 13.0s ease-in-out infinite" x="40" y="518" width="600" height="92" rx="12" fill="var(--purple)" fill-opacity=".07" stroke="var(--purple)" stroke-width="2.5"/><rect x="40" y="532" width="5" height="64" rx="2.5" fill="var(--purple)"/><text x="64" y="545" class="tag" fill="var(--purple)">AUTOMATIC CHECK</text><text x="64" y="570" class="title">A script tests every line</text><text x="64" y="594" class="body">Flags AI writing habits, layout problems, and numbers you never gave.</text><path d="M340 616 V636" stroke="var(--line)" stroke-width="2" stroke-linecap="round"/><path d="M334 630 l6 7 l6 -7" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle class="dot" style="animation:go3 13.0s ease-in-out infinite" cx="340" cy="616" r="5" fill="var(--green)"/><rect class="card" x="40" y="644" width="600" height="92" rx="12"/><rect class="lit" style="animation:lit4 13.0s ease-in-out infinite" x="40" y="644" width="600" height="92" rx="12" fill="var(--green)" fill-opacity=".07" stroke="var(--green)" stroke-width="2.5"/><rect x="40" y="658" width="5" height="64" rx="2.5" fill="var(--green)"/><text x="64" y="671" class="tag" fill="var(--green)">YOU</text><text x="64" y="696" class="title">You approve every changed line</text><text x="64" y="720" class="body">Is it true? Could you explain it in an interview?</text><path d="M340 742 V762" stroke="var(--line)" stroke-width="2" stroke-linecap="round"/><path d="M334 756 l6 7 l6 -7" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle class="dot" style="animation:go4 13.0s ease-in-out infinite" cx="340" cy="742" r="5" fill="var(--brand)"/><rect class="card" x="40" y="770" width="600" height="114" rx="12"/><rect class="lit" style="animation:lit5 13.0s ease-in-out infinite" x="40" y="770" width="600" height="114" rx="12" fill="var(--brand)" fill-opacity=".07" stroke="var(--brand)" stroke-width="2.5"/><rect x="40" y="784" width="5" height="86" rx="2.5" fill="var(--brand)"/><text x="64" y="797" class="tag" fill="var(--brand)">RESULT</text><text x="64" y="822" class="title">A resume you can defend</text><text x="64" y="846" class="body">Readable by screening software, honest about what you lack,</text><text x="64" y="868" class="body">with the interview questions to expect.</text></svg>
