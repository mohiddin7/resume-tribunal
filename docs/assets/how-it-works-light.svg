<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 496" width="560" height="496" role="img" aria-labelledby="t d"><title id="t">How Resume Tribunal works</title><desc id="d">Step 1, you share your resume, the job link and a few words about what you did. Step 2, your AI writes it from your facts only and a different company's AI checks it without being told who wrote it. Step 3, you approve each change and download a resume where every line is true.</desc><style>svg{--bg:#f7f4ef;--surf:#fffdf9;--ink:#221e19;--muted:#5f574d;--line:#ddd5c8;--brand:#a8515c;--onbrand:#ffffff;--blue:#35619a;--green:#2f6c36;--purple:#685497;--danger:#a14126;--tint:#f3e6e6}text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}@keyframes l0{0.00%{opacity:0}0.00%{opacity:0}3.33%{opacity:1}84.44%{opacity:1}91.11%{opacity:0}100.00%{opacity:0}}@keyframes d0{0.00%{opacity:0;transform:translateY(0)}13.33%{opacity:0;transform:translateY(0)}14.44%{opacity:1;transform:translateY(0)}23.33%{opacity:1;transform:translateY(16px)}24.44%{opacity:0;transform:translateY(16px)}100.00%{opacity:0}}@keyframes l1{0.00%{opacity:0}24.44%{opacity:0}27.78%{opacity:1}84.44%{opacity:1}91.11%{opacity:0}100.00%{opacity:0}}@keyframes d1{0.00%{opacity:0;transform:translateY(0)}37.78%{opacity:0;transform:translateY(0)}38.89%{opacity:1;transform:translateY(0)}47.78%{opacity:1;transform:translateY(16px)}48.89%{opacity:0;transform:translateY(16px)}100.00%{opacity:0}}@keyframes l2{0.00%{opacity:0}48.89%{opacity:0}52.22%{opacity:1}84.44%{opacity:1}91.11%{opacity:0}100.00%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="560" height="496" rx="18" fill="var(--bg)"/><text x="24" y="40" font-size="22" font-weight="800" fill="var(--ink)">How Resume Tribunal works</text><rect x="24" y="70" width="512" height="104" rx="16" fill="var(--surf)" stroke="var(--line)" stroke-width="1.5"/><rect style="animation:l0 9s linear infinite" x="24" y="70" width="512" height="104" rx="16" fill="var(--green)" fill-opacity=".08" stroke="var(--green)" stroke-width="2.5"/><circle cx="74" cy="122.0" r="24" fill="var(--green)"/><text x="74" y="131.0" text-anchor="middle" font-size="24" font-weight="800" fill="var(--onbrand)">1</text><text x="118" y="108" font-size="20" font-weight="800" fill="var(--ink)">You share</text><text x="118" y="133" font-size="15" fill="var(--muted)">Your resume, the job link, and a few</text><text x="118" y="154" font-size="15" fill="var(--muted)">words about what you really did.</text><path d="M74 178 v20" stroke="var(--line)" stroke-width="2.5" stroke-linecap="round"/><circle style="animation:d0 9s linear infinite" cx="74" cy="180" r="5" fill="var(--brand)"/><rect x="24" y="202" width="512" height="104" rx="16" fill="var(--surf)" stroke="var(--line)" stroke-width="1.5"/><rect style="animation:l1 9s linear infinite" x="24" y="202" width="512" height="104" rx="16" fill="var(--brand)" fill-opacity=".08" stroke="var(--brand)" stroke-width="2.5"/><circle cx="74" cy="254.0" r="24" fill="var(--brand)"/><text x="74" y="263.0" text-anchor="middle" font-size="24" font-weight="800" fill="var(--onbrand)">2</text><text x="118" y="240" font-size="20" font-weight="800" fill="var(--ink)">Two AIs work on it</text><text x="118" y="265" font-size="15" fill="var(--muted)">Your AI writes it from your facts only.</text><text x="118" y="286" font-size="15" fill="var(--muted)">A different company's AI checks it blind.</text><path d="M74 310 v20" stroke="var(--line)" stroke-width="2.5" stroke-linecap="round"/><circle style="animation:d1 9s linear infinite" cx="74" cy="312" r="5" fill="var(--blue)"/><rect x="24" y="334" width="512" height="104" rx="16" fill="var(--surf)" stroke="var(--line)" stroke-width="1.5"/><rect style="animation:l2 9s linear infinite" x="24" y="334" width="512" height="104" rx="16" fill="var(--blue)" fill-opacity=".08" stroke="var(--blue)" stroke-width="2.5"/><circle cx="74" cy="386.0" r="24" fill="var(--blue)"/><text x="74" y="395.0" text-anchor="middle" font-size="24" font-weight="800" fill="var(--onbrand)">3</text><text x="118" y="372" font-size="20" font-weight="800" fill="var(--ink)">You approve</text><text x="118" y="397" font-size="15" fill="var(--muted)">Say yes to each change, then download</text><text x="118" y="418" font-size="15" fill="var(--muted)">a resume where every line is true.</text><text x="24" y="474" font-size="14" fill="var(--muted)">A script also checks every number and name against your own words.</text></svg>
