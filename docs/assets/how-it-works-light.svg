<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 970" width="680" height="970" role="img" aria-labelledby="t d"><title id="t">How Resume Tribunal works</title><desc id="d">Step 1: Share the job and your resume. Paste the job link, attach your resume, and add a few words about what you really did. Step 2: It rewrites your resume for this job. Uses the job's own words for the skills you really have, so you read like a match. Step 3: A second AI reads it like the hiring manager. Would they shortlist you? What's missing? It isn't told who wrote the draft. Step 4: A script checks the details. A layout screening software can read, no AI-sounding phrases, no numbers you never gave. Step 5: You approve the changes. Say yes to each one. Nothing goes in that you couldn't explain in an interview. Step 6: Your resume, ready to send. Plus what the job asks for that you don't show yet, and the questions to expect.</desc><style>svg{--bg:#f7f4ef;--surf:#fffdf9;--ink:#221e19;--muted:#5f574d;--line:#ddd5c8;--brand:#a8515c;--onbrand:#ffffff;--blue:#35619a;--green:#2f6c36;--purple:#685497;--danger:#a14126;--tint:#f3e6e6}text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}@keyframes l0{0.00%{opacity:0}0.00%{opacity:0}2.50%{opacity:1}94.00%{opacity:1}98.17%{opacity:0}100.00%{opacity:0}}@keyframes d0{0.00%{opacity:0;transform:translateY(0)}6.67%{opacity:0;transform:translateY(0)}7.50%{opacity:1;transform:translateY(0)}12.50%{opacity:1;transform:translateY(18px)}13.33%{opacity:0;transform:translateY(18px)}100.00%{opacity:0}}@keyframes l1{0.00%{opacity:0}13.33%{opacity:0}15.83%{opacity:1}94.00%{opacity:1}98.17%{opacity:0}100.00%{opacity:0}}@keyframes d1{0.00%{opacity:0;transform:translateY(0)}20.00%{opacity:0;transform:translateY(0)}20.83%{opacity:1;transform:translateY(0)}25.83%{opacity:1;transform:translateY(18px)}26.67%{opacity:0;transform:translateY(18px)}100.00%{opacity:0}}@keyframes l2{0.00%{opacity:0}26.67%{opacity:0}29.17%{opacity:1}94.00%{opacity:1}98.17%{opacity:0}100.00%{opacity:0}}@keyframes sw0{0.00%{transform:translateX(0)}30.00%{transform:translateX(0)}36.67%{transform:translateX(368px)}94.00%{transform:translateX(368px)}99.00%{transform:translateX(0)}100.00%{transform:translateX(0)}}@keyframes sw2{0.00%{transform:translateX(0)}30.00%{transform:translateX(0)}36.67%{transform:translateX(-368px)}94.00%{transform:translateX(-368px)}99.00%{transform:translateX(0)}100.00%{transform:translateX(0)}}@keyframes d2{0.00%{opacity:0;transform:translateY(0)}33.33%{opacity:0;transform:translateY(0)}34.17%{opacity:1;transform:translateY(0)}39.17%{opacity:1;transform:translateY(18px)}40.00%{opacity:0;transform:translateY(18px)}100.00%{opacity:0}}@keyframes l3{0.00%{opacity:0}40.00%{opacity:0}42.50%{opacity:1}94.00%{opacity:1}98.17%{opacity:0}100.00%{opacity:0}}@keyframes d3{0.00%{opacity:0;transform:translateY(0)}46.67%{opacity:0;transform:translateY(0)}47.50%{opacity:1;transform:translateY(0)}52.50%{opacity:1;transform:translateY(18px)}53.33%{opacity:0;transform:translateY(18px)}100.00%{opacity:0}}@keyframes l4{0.00%{opacity:0}53.33%{opacity:0}55.83%{opacity:1}94.00%{opacity:1}98.17%{opacity:0}100.00%{opacity:0}}@keyframes d4{0.00%{opacity:0;transform:translateY(0)}60.00%{opacity:0;transform:translateY(0)}60.83%{opacity:1;transform:translateY(0)}65.83%{opacity:1;transform:translateY(18px)}66.67%{opacity:0;transform:translateY(18px)}100.00%{opacity:0}}@keyframes l5{0.00%{opacity:0}66.67%{opacity:0}69.17%{opacity:1}94.00%{opacity:1}98.17%{opacity:0}100.00%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="680" height="970" rx="18" fill="var(--bg)"/><text x="40" y="44" font-size="23" font-weight="800" fill="var(--ink)">How Resume Tribunal works</text><text x="40" y="66" font-size="14" fill="var(--muted)">About 5 minutes. Each step lights up in turn.</text><rect x="40" y="84" width="600" height="110" rx="14" fill="var(--surf)" stroke="var(--line)" stroke-width="1.5"/><rect style="animation:l0 12.0s linear infinite" x="40" y="84" width="600" height="110" rx="14" fill="var(--green)" fill-opacity=".07" stroke="var(--green)" stroke-width="2.5"/><rect x="40" y="98" width="5" height="82" rx="2.5" fill="var(--green)"/><text x="64" y="110" font-size="12" font-weight="700" letter-spacing="1.2" fill="var(--green)">YOU</text><text x="64" y="134" font-size="19" font-weight="800" fill="var(--ink)">Share the job and your resume</text><text x="64" y="157" font-size="15" fill="var(--muted)">Paste the job link, attach your resume, and add a few words about</text><text x="64" y="179" font-size="15" fill="var(--muted)">what you really did.</text><path d="M340.0 199V217" stroke="var(--line)" stroke-width="2" stroke-linecap="round"/><path d="M334.0 211l6 7 6-7" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle style="animation:d0 12.0s linear infinite" cx="340.0" cy="200" r="5" fill="var(--blue)"/><rect x="40" y="224" width="600" height="110" rx="14" fill="var(--surf)" stroke="var(--line)" stroke-width="1.5"/><rect style="animation:l1 12.0s linear infinite" x="40" y="224" width="600" height="110" rx="14" fill="var(--blue)" fill-opacity=".07" stroke="var(--blue)" stroke-width="2.5"/><rect x="40" y="238" width="5" height="82" rx="2.5" fill="var(--blue)"/><text x="64" y="250" font-size="12" font-weight="700" letter-spacing="1.2" fill="var(--blue)">AI 1 · YOUR AI</text><text x="64" y="274" font-size="19" font-weight="800" fill="var(--ink)">It rewrites your resume for this job</text><text x="64" y="297" font-size="15" fill="var(--muted)">Uses the job's own words for the skills you really have, so you</text><text x="64" y="319" font-size="15" fill="var(--muted)">read like a match.</text><path d="M340.0 339V357" stroke="var(--line)" stroke-width="2" stroke-linecap="round"/><path d="M334.0 351l6 7 6-7" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle style="animation:d1 12.0s linear infinite" cx="340.0" cy="340" r="5" fill="var(--brand)"/><rect x="40" y="364" width="600" height="156" rx="14" fill="var(--surf)" stroke="var(--line)" stroke-width="1.5"/><rect style="animation:l2 12.0s linear infinite" x="40" y="364" width="600" height="156" rx="14" fill="var(--brand)" fill-opacity=".07" stroke="var(--brand)" stroke-width="2.5"/><rect x="40" y="378" width="5" height="128" rx="2.5" fill="var(--brand)"/><text x="64" y="390" font-size="12" font-weight="700" letter-spacing="1.2" fill="var(--brand)">AI 2 · A DIFFERENT COMPANY</text><text x="64" y="414" font-size="19" font-weight="800" fill="var(--ink)">A second AI reads it like the hiring manager</text><text x="64" y="437" font-size="15" fill="var(--muted)">Would they shortlist you? What's missing? It isn't told who wrote</text><text x="64" y="459" font-size="15" fill="var(--muted)">the draft.</text><g style="animation:sw0 12.0s linear infinite"><rect x="64" y="476" width="168" height="26" rx="13" fill="var(--bg)" stroke="var(--line)"/><text x="148" y="493" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">Draft K</text></g><g ><rect x="248" y="476" width="168" height="26" rx="13" fill="var(--bg)" stroke="var(--line)"/><text x="332" y="493" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">Draft M</text></g><g style="animation:sw2 12.0s linear infinite"><rect x="432" y="476" width="168" height="26" rx="13" fill="var(--bg)" stroke="var(--line)"/><text x="516" y="493" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">Draft R</text></g><path d="M340.0 525V543" stroke="var(--line)" stroke-width="2" stroke-linecap="round"/><path d="M334.0 537l6 7 6-7" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle style="animation:d2 12.0s linear infinite" cx="340.0" cy="526" r="5" fill="var(--purple)"/><rect x="40" y="550" width="600" height="110" rx="14" fill="var(--surf)" stroke="var(--line)" stroke-width="1.5"/><rect style="animation:l3 12.0s linear infinite" x="40" y="550" width="600" height="110" rx="14" fill="var(--purple)" fill-opacity=".07" stroke="var(--purple)" stroke-width="2.5"/><rect x="40" y="564" width="5" height="82" rx="2.5" fill="var(--purple)"/><text x="64" y="576" font-size="12" font-weight="700" letter-spacing="1.2" fill="var(--purple)">AUTOMATIC CHECK</text><text x="64" y="600" font-size="19" font-weight="800" fill="var(--ink)">A script checks the details</text><text x="64" y="623" font-size="15" fill="var(--muted)">A layout screening software can read, no AI-sounding phrases, no</text><text x="64" y="645" font-size="15" fill="var(--muted)">numbers you never gave.</text><path d="M340.0 665V683" stroke="var(--line)" stroke-width="2" stroke-linecap="round"/><path d="M334.0 677l6 7 6-7" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle style="animation:d3 12.0s linear infinite" cx="340.0" cy="666" r="5" fill="var(--green)"/><rect x="40" y="690" width="600" height="110" rx="14" fill="var(--surf)" stroke="var(--line)" stroke-width="1.5"/><rect style="animation:l4 12.0s linear infinite" x="40" y="690" width="600" height="110" rx="14" fill="var(--green)" fill-opacity=".07" stroke="var(--green)" stroke-width="2.5"/><rect x="40" y="704" width="5" height="82" rx="2.5" fill="var(--green)"/><text x="64" y="716" font-size="12" font-weight="700" letter-spacing="1.2" fill="var(--green)">YOU</text><text x="64" y="740" font-size="19" font-weight="800" fill="var(--ink)">You approve the changes</text><text x="64" y="763" font-size="15" fill="var(--muted)">Say yes to each one. Nothing goes in that you couldn't explain in</text><text x="64" y="785" font-size="15" fill="var(--muted)">an interview.</text><path d="M340.0 805V823" stroke="var(--line)" stroke-width="2" stroke-linecap="round"/><path d="M334.0 817l6 7 6-7" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle style="animation:d4 12.0s linear infinite" cx="340.0" cy="806" r="5" fill="var(--brand)"/><rect x="40" y="830" width="600" height="110" rx="14" fill="var(--surf)" stroke="var(--line)" stroke-width="1.5"/><rect style="animation:l5 12.0s linear infinite" x="40" y="830" width="600" height="110" rx="14" fill="var(--brand)" fill-opacity=".07" stroke="var(--brand)" stroke-width="2.5"/><rect x="40" y="844" width="5" height="82" rx="2.5" fill="var(--brand)"/><text x="64" y="856" font-size="12" font-weight="700" letter-spacing="1.2" fill="var(--brand)">RESULT</text><text x="64" y="880" font-size="19" font-weight="800" fill="var(--ink)">Your resume, ready to send</text><text x="64" y="903" font-size="15" fill="var(--muted)">Plus what the job asks for that you don't show yet, and the</text><text x="64" y="925" font-size="15" fill="var(--muted)">questions to expect.</text></svg>
